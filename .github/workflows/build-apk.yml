name: Build Plannin APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Extract project
        run: |
          unzip -o Plannin_project.zip -d .

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle -p Plannin assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Plannin-APK
          path: Plannin/app/build/outputs/apk/debug/*.apk
